<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POP OFFERBIN by GABS</title>
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f7f8;--card:#fff;--line:#dce4e7;--tx:#10181b;--mute:#6b7c82;--ac:#00a7bd;--acx:#fff;--bad:#e5484d;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#0b0f10;--line:#1d2629;--tx:#eef6f8;--mute:#7f949b;--ac:#22d3ee;--acx:#00262c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#0b0f10;--line:#1d2629;--tx:#eef6f8;--mute:#7f949b;--ac:#22d3ee;--acx:#00262c;color-scheme:dark}
:root[data-theme="light"]{--bg:#f4f7f8;--card:#fff;--line:#dce4e7;--tx:#10181b;--mute:#6b7c82;--ac:#00a7bd;--acx:#fff;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Nunito',system-ui,sans-serif;font-size:16px;transition:background .3s,color .3s}
.wrap{max-width:620px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brand{flex:1;min-width:0}
h1{font-size:20px;margin:0;font-weight:800;line-height:1.1}h1 span{color:var(--ac)}
.by{font-size:11px;color:#8a9a9f;font-weight:600;margin-top:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit;cursor:pointer;transition:transform .15s ease,background .25s ease,color .25s ease,border-color .25s ease;outline:none}
button:active{transform:scale(.97)}
.ib{background:none;border:1px solid var(--line);color:var(--tx);border-radius:12px;width:42px;height:42px;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;transition:background .3s,border-color .3s}
h2{font-size:13px;color:var(--mute);margin:16px 0 8px;font-weight:800;letter-spacing:.4px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:0 0 4px}
input[type=text],input[type=number]{width:100%;font-family:inherit;font-size:16px;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;transition:border-color .25s;-webkit-appearance:none;appearance:none}
input:focus{outline:none;box-shadow:none;border-color:var(--line)}
input::placeholder{color:transparent}
.sk{position:relative}.sk input{padding-right:52px}
.cam{position:absolute;right:4px;top:0;bottom:0;margin:auto 0;width:42px;height:42px;border:0;background:none;color:var(--ac);border-radius:10px;display:grid;place-items:center}
.row{display:flex;gap:10px;margin-bottom:12px}.row>div{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin:2px 0 14px;cursor:pointer;user-select:none}
.chk input{display:none}
.box{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;color:transparent;transition:background .25s,border-color .25s,color .25s}
.chk input:checked+.box{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.box svg{width:16px;height:16px;stroke-width:3}
.pri{width:100%;background:var(--ac);color:var(--acx);border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar button{flex:1;background:none;border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:14px;font-weight:800;font-size:15px}
.bar .p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bar button.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.fn{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.fn input{flex:1}.fn span{font-size:14px;font-weight:700;color:var(--mute)}
.cnt{color:var(--mute);font-size:13px;font-weight:700;margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);animation:in .35s ease both}
.item:first-child{border-top:0}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info{flex:1;min-width:0}.sku{font-weight:800;word-break:break-all}
.price{color:var(--mute);font-weight:600;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--acx);background:var(--ac);border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.mini{background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}.mini.d{color:var(--bad)}
.mini.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.empty{text-align:center;color:var(--mute);padding:20px 0;font-weight:600}
.pv{width:100%;overflow:hidden;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;transition:height .35s ease}
.sheet{--u:8.1mm;--or:#e8a050;width:297mm;height:210mm;background:#fff;color:#000;display:grid;grid-template-columns:repeat(3,99mm);grid-template-rows:repeat(3,70mm);transform-origin:top left;font-family:Arial,Helvetica,sans-serif}
.cell{position:relative;padding:11mm 5mm 0}
.big{position:relative;width:calc(11*var(--u));height:46mm}
.bc{position:absolute;left:0;top:0;width:calc(8*var(--u));height:100%;display:grid;grid-template-columns:repeat(4,1fr);border:.6mm solid var(--or)}
.bc div{position:relative;display:flex;align-items:flex-end;justify-content:center;font-size:26mm;font-weight:600;line-height:.8;padding-bottom:4.5mm}
.bc div+div{border-left:.6mm solid var(--or)}
.bc .rp{position:absolute;left:0;right:0;top:2mm;text-align:center;font-size:5.5mm;font-weight:700;line-height:1}
.sm{position:absolute;right:0;bottom:0;width:calc(3*var(--u));height:54%;display:grid;grid-template-columns:repeat(3,1fr);border:.6mm solid var(--or);border-left:0}
.sm div{display:flex;align-items:flex-end;justify-content:center;font-size:10.5mm;font-weight:800;line-height:.8;padding-bottom:4mm;-webkit-text-stroke:.35mm #000}
.sm div+div{border-left:.6mm solid var(--or)}
.old{position:absolute;left:calc(1.5*var(--u));width:calc(5*var(--u));top:0;height:11mm;text-align:center;font-size:6.5mm;line-height:8mm}
.old:after{content:"";position:absolute;left:0;right:0;top:4.2mm;border-top:.4mm solid #e02020;transform:rotate(-6deg)}
.clip{position:absolute;right:0;top:0;width:10mm;height:auto;display:block}
.skus{display:flex;margin-top:1.8mm;width:max-content}
.skus b{width:var(--u);height:7.5mm;border:.6mm solid var(--or);border-left-width:0;text-align:center;font-size:5.5mm;line-height:6.5mm;font-weight:700}
.skus b:first-child{border-left-width:.6mm}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;text-align:center;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#scan{position:fixed;inset:0;background:#000;display:none;z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-weight:700}
#scan.on{display:flex;animation:in .25s ease}
#scan video{width:100%;max-height:70vh;object-fit:cover}
</style>
</head>

<div class="wrap">
<header>
  <div class="brand"><h1>POP <span>OFFERBIN</span></h1><div class="by">by GABS</div></div>
  <button class="ib" id="theme" aria-label="Tema"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

    <div><label class="f">HARGA</label><input type="text" id="harga" inputmode="numeric" maxlength="9" autocomplete="off" placeholder=" "></div>
  </div>
  <label class="chk"><input type="checkbox" id="best"><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span>Best Price</label>
  <div id="lamaWrap" style="display:none" class="row"><div><label class="f">HARGA LAMA (tampil di atas, dicoret)</label><input type="text" id="lama" inputmode="numeric" maxlength="9" autocomplete="off" placeholder=" "><div id="lamaMsg" style="color:var(--bad);font-size:12px;font-weight:700;margin-top:4px"></div></div></div>
  <button class="pri" id="save">Simpan</button>
</div>

<h2>EKSPOR EXCEL</h2>
<div class="card">
  <div class="fn"><input type="text" id="fname" value="POP-OFFERBIN" maxlength="80" autocomplete="off"><span>.xlsx</span></div>
  <div class="bar" style="margin:0"><button class="p" id="xlsx">Ekspor Excel</button><button id="clear">Hapus semua</button></div>
</div>
</div>

<input type="file" id="pick" accept="image/*" capture="environment" hidden>

function arm(btn,key){
  if(armed===key){clearTimeout(armT);armed=null;return true}

}
function split(p){
  p=Math.max(0,Math.round(Number(p)||0));
  let big='',small;
  if(p>=1000){big=String(Math.floor(p/1000));small=String(p%1000).padStart(3,'0')}else small=String(p);
  const pad=(s,n)=>Array.from({length:n},(_,i)=>s[i-(n-s.length)]||'');
  return {big:pad(big.slice(-4),4),small:pad(small,3)};
}
function cell(d){
  const s=d?split(d.harga):{big:['','','',''],small:['','','']};
  const chars=d?[...String(d.sku)].slice(0,7):[];while(chars.length<7)chars.push('');
  const old=d&&d.best&&d.lama?`<div class="old">${nf(d.lama)}</div>`:'';
  return `<div class="cell"><div class="big"><div class="bc">${s.big.map((c,i)=>`<div>${i===0?'<span class="rp">Rp.</span>':''}${c}</div>`).join('')}<img class="clip" src="${LOGO}" alt=""></div><div class="sm">${s.small.map(c=>`<div>${c}</div>`).join('')}</div>${old}</div><div class="skus">${chars.map(c=>`<b>${esc(c)}</b>`).join('')}</div></div>`;
}
function fit(){document.querySelectorAll('.pv').forEach(pv=>{const s=pv.firstElementChild;s.style.transform='none';const sc=pv.clientWidth/s.offsetWidth;s.style.transform=`scale(${sc})`;pv.style.height=(s.offsetHeight*sc)+'px'})}
function render(){
  $('#cnt').textContent=data.length+' POP · '+data.filter(d=>d.best).length+' best price';
  $('#list').innerHTML=data.length?data.map(d=>`<div class="item"><div class="info"><div class="sku">${esc(d.sku)}${d.best?'<span class="tag">BEST PRICE</span>':''}</div><div class="price">Rp ${nf(d.harga)}${d.best&&d.lama?' (lama '+nf(d.lama)+')':''}</div></div>
  <button class="mini" data-e="${d.id}" aria-label="Edit"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="mini d" data-d="${d.id}" aria-label="Hapus"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></div>`).join(''):'<div class="empty">Belum ada data</div>';
  const n=Math.max(1,Math.ceil(data.length/9));let h='';
  for(let p=0;p<n;p++){let c='';for(let i=0;i<9;i++)c+=cell(data[p*9+i]);h+=`<div class="pv"><div class="sheet">${c}</div></div>`}
  $('#pages').innerHTML=h;fit();
}
addEventListener('resize',fit);
function reset(){editId=null;$('#sku').value='';$('#harga').value='';$('#lama').value='';$('#best').checked=false;$('#lamaWrap').style.display='none';$('#lamaMsg').textContent='';$('#lama').style.borderColor='';$('#mode').textContent='TAMBAH POP';$('#save').textContent='Simpan'}
const fmt=v=>String(v).replace(/\D/g,'').slice(0,7).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const num=id=>Number($(id).value.replace(/\./g,''))||0;
/* harga lama wajib lebih tinggi dari harga baru */
function chkLama(){
  const bad=$('#best').checked&&$('#lama').value!==''&&num('#lama')<=num('#harga');
  $('#lama').style.borderColor=bad?'var(--bad)':'';
  $('#lamaMsg').textContent=bad?'Harga lama harus lebih tinggi dari harga baru':'';
  return !bad;
}
['#harga','#lama'].forEach(id=>$(id).addEventListener('input',e=>{e.target.value=fmt(e.target.value);chkLama()}));
$('#sku').addEventListener('input',e=>{e.target.value=e.target.value.slice(0,7)});
$('#best').onchange=e=>{$('#lamaWrap').style.display=e.target.checked?'flex':'none';chkLama()};
$('#save').onclick=()=>{
  const sku=$('#sku').value.trim(),h=$('#harga').value.replace(/\./g,''),best=$('#best').checked,lama=$('#lama').value.replace(/\./g,'');
  if(!sku||h===''){toast('Isi SKU dan harga');return}
  if(best&&lama===''){toast('Isi harga lama');return}
  if(best&&Number(lama)<=Number(h)){chkLama();toast('Harga lama harus lebih tinggi dari harga baru');return}
  const rec={sku:sku.slice(0,7),harga:Number(h),best,lama:best?Number(lama):null};
  if(editId){const i=data.findIndex(d=>d.id===editId);data[i]={...data[i],...rec}}else data.push({id:Date.now()+Math.random(),...rec});
  store();reset();render();toast('Tersimpan');
};
$('#list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e){const d=data.find(x=>String(x.id)===b.dataset.e);editId=d.id;$('#sku').value=d.sku;$('#harga').value=fmt(d.harga);$('#best').checked=d.best;$('#lamaWrap').style.display=d.best?'flex':'none';$('#lama').value=d.lama?fmt(d.lama):'';chkLama();$('#mode').textContent='EDIT POP';$('#save').textContent='Perbarui';$('#sku').scrollIntoView({behavior:'smooth',block:'center'})}
  if(b.dataset.d&&arm(b,'d'+b.dataset.d)){data=data.filter(x=>String(x.id)!==b.dataset.d);store();reset();render();toast('Terhapus')}
};
$('#clear').onclick=e=>{if(data.length&&arm(e.currentTarget,'all')){data=[];store();reset();render();toast('Semua terhapus')}};
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('offerbin-theme',n)}catch(e){}};

/* ===== Scan SKU dari kamera (barcode) ===== */
async function detectFrom(src){
  if(!('BarcodeDetector' in window)){return null}
  try{const det=new BarcodeDetector();const r=await det.detect(src);return r.length?r[0].rawValue:null}catch(e){return null}
}
const cleanCode=c=>String(c).replace(/^\][A-Za-z][0-9A-Za-z]/,'').replace(/[\u0000-\u001f\u007f]/g,'').trim();
function applySku(code){$('#sku').value=cleanCode(code).slice(0,7);toast('SKU terbaca: '+$('#sku').value)}
window.onNativeScan=c=>applySku(c);
async function stopScan(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#scan').classList.remove('on')}
$('#scanStop').onclick=stopScan;
$('#camBtn').onclick=async()=>{
  if(window.Android&&Android.scan){Android.scan();return}
  if('BarcodeDetector' in window&&navigator.mediaDevices){
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const v=$('#vid');v.srcObject=stream;await v.play();$('#scan').classList.add('on');scanning=true;
      const det=new BarcodeDetector();
      const loop=async()=>{if(!scanning)return;try{const r=await det.detect(v);if(r.length){const code=r[0].rawValue;await stopScan();applySku(code);return}}catch(e){}requestAnimationFrame(loop)};
      loop();return;
    }catch(e){/* fallback ke pilih foto */}
  }
  $('#pick').click();
};
$('#pick').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const bmp=await createImageBitmap(f);const code=await detectFrom(bmp);if(code)applySku(code);else toast('Barcode tidak terbaca, coba lagi lebih dekat')}catch(err){toast('Gagal membaca foto')}
};

/* ===== Ekspor Excel ===== */
async function exportXlsx(){
  if(!data.length){toast('Belum ada data');return}
  let name=($('#fname').value.trim()||'POP-OFFERBIN').replace(/[\\/:*?"<>|]/g,'').replace(/\.xlsx$/i,'');
  if(!name)name='POP-OFFERBIN';
  const native=!!(window.Android&&Android.save);
  let dl=null;
  if(!native){try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dl=null}}
  if(!native&&!dl){toast('Fitur simpan file tidak aktif di tampilan ini. Buka lewat link Claude.');return}
  if(!window.ExcelJS){toast('Pustaka Excel belum termuat, cek koneksi');return}
  const wb=new ExcelJS.Workbook();
  wb.creator='POP OFFERBIN by GABS';
  const ws=wb.addWorksheet('POP',{pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:.3,right:.3,top:.3,bottom:.3,header:0,footer:0}}});
  /* Tanpa gabung sel. 1 POP = 11 kolom satuan (kotak besar 2 satuan, kotak kecil & SKU 1 satuan) + 1 kolom jarak */
  for(let c=1;c<=35;c++)ws.getColumn(c).width=(c%12===0)?4.3:3.7;
  const pages=Math.max(1,Math.ceil(data.length/9));
  const OR={style:'medium',color:{argb:'FFE8A050'}};
  let logoId=null,lineId=null;
  try{logoId=wb.addImage({base64:LOGO,extension:'png'})}catch(e){}
  try{
    const cv=document.createElement('canvas');cv.width=232;cv.height=40;const g=cv.getContext('2d');
    g.strokeStyle='#e02020';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(6,35);g.lineTo(226,6);g.stroke();
    lineId=wb.addImage({base64:cv.toDataURL('image/png'),extension:'png'});
  }catch(e){}
  const F=(sz,b=true)=>({name:'Arial',size:sz,bold:b});
  const C={horizontal:'center',vertical:'bottom'};
  const CC=v=>({horizontal:'centerContinuous',vertical:v});
  const put=(r,c,val,font,al,edges)=>{
    const cell=ws.getCell(r,c);
    if(val!==null&&val!==undefined&&val!=='')cell.value=val;
    if(font)cell.font=font;
    if(al)cell.alignment=al;
    const bd={};
    if(edges.includes('t'))bd.top=OR;
    if(edges.includes('b'))bd.bottom=OR;
    if(edges.includes('l'))bd.left=OR;
    if(edges.includes('r'))bd.right=OR;
    cell.border=bd;
  };
  /* tinggi baris: atas, tengah, angka, jarak, SKU, spasi antar POP */
  const H=[28,28,70,8,24,14];
  for(let p=0;p<pages;p++){
    for(let br=0;br<3;br++){const r0=p*18+br*6+1;H.forEach((h,k)=>{ws.getRow(r0+k).height=h})}
    for(let i=0;i<9;i++){
      const d=data[p*9+i],t=i%3,br=Math.floor(i/3),c0=1+t*12,r0=p*18+br*6+1;
      const s=d?split(d.harga):{big:['','','',''],small:['','','']};
      const promo=d&&d.best&&d.lama;
      /* garis vertikal kotak besar hanya di batas kotak (kolom genap) dan tepi kanan */
      const edge=(u,top,bot)=>(top?'t':'')+(bot?'b':'')+(u%2===0?'l':'')+(u===7?'r':'');
      for(let u=0;u<8;u++){
        let val=null,font=null,al=null;
        if(u===0){val='Rp.';font=F(14);al=CC('top')}
        else if(u===1){al=CC('top')}
        else if(promo&&u===2){val=nf(d.lama);font=F(15,false);al=CC('middle')}
        else if(promo&&u>2&&u<6){al=CC('middle')}
        put(r0,c0+u,val,font,al,edge(u,true,false));
        put(r0+1,c0+u,null,null,null,edge(u,false,false));
        const k=u>>1,dig=s.big[k];
        put(r0+2,c0+u,u%2===0&&dig?dig:null,F(54,false),dig?CC('bottom'):C,edge(u,false,true));
      }
      /* 3 kotak kecil (hanya di baris angka) */
      for(let j=0;j<3;j++)put(r0+2,c0+8+j,s.small[j]||null,F(26,true),C,'tblr');
      /* 7 kotak SKU terpisah di bawah */
      const sk=d?[...String(d.sku)].slice(0,7):[];
      for(let k=0;k<7;k++)put(r0+4,c0+k,sk[k]||null,F(16),{horizontal:'center',vertical:'middle'},'tblr');
      /* logo cokelat: rapat ke tepi kanan atas kotak besar (jangkar dua sel, tepi kanan = garis kanan kotak) */
      if(logoId!==null)ws.addImage(logoId,{tl:{nativeCol:c0+5,nativeColOff:190500,nativeRow:r0-1,nativeRowOff:19050},br:{nativeCol:c0+7,nativeColOff:0,nativeRow:r0-1,nativeRowOff:247650},editAs:'oneCell'});
      /* garis merah miring menutupi harga lama */
      if(promo&&lineId!==null)ws.addImage(lineId,{tl:{col:c0+1.04,row:r0-1+0.18},ext:{width:114,height:20}});
    }
    if(p<pages-1)ws.getRow((p+1)*18).addPageBreak();
  }
  try{
    const buf=await wb.xlsx.writeBuffer();
    if(native){
      const u8=new Uint8Array(buf);let bin='';
      for(let i=0;i<u8.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
      const r=Android.save(name+'.xlsx',btoa(bin));
      toast(r==='ok'?'Tersimpan di folder Download: '+name+'.xlsx':'Gagal menyimpan: '+r);return;
    }
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const res=await dl.save({filename:name+'.xlsx',data:blob});
    toast(res&&res.status==='saved'?'File Excel tersimpan':'File Excel siap');
  }catch(e){
    if(e&&e.code==='declined')toast('Penyimpanan dibatalkan');
    else if(e&&e.code==='rejected_extension')toast('Nama file tidak valid');
    else toast('Gagal menyimpan: '+(e&&e.code||'tidak diketahui'));
  }
}
$('#xlsx').onclick=exportXlsx;
render();
</script>
