<meta name="theme-color" content="#00a7bd">
<meta name="application-name" content="POP OFFERBIN">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f4f7f8;--card:#fff;--line:#dce4e7;--tx:#10181b;--mute:#6b7c82;--ac:#00a7bd;--acx:#fff;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0b0f10;--line:#1d2629;--tx:#eef6f8;--mute:#7f949b;--ac:#22d3ee;--acx:#00262c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#0b0f10;--line:#1d2629;--tx:#eef6f8;--mute:#7f949b;--ac:#22d3ee;--acx:#00262c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Nunito',system-ui,sans-serif;font-size:16px}
.wrap{max-width:620px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:800;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
h1 span.ac{color:var(--ac)}
h1 .by{font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit;cursor:pointer;transition:transform .15s ease,background .2s ease,border-color .2s ease,opacity .2s ease,box-shadow .2s ease}
button:active{transform:scale(.97)}
.ib{background:none;border:1px solid var(--line);color:var(--tx);border-radius:12px;width:42px;height:42px;display:grid;place-items:center}
.ib:focus{outline:none;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;transition:border-color .2s ease}
h2{font-size:13px;color:var(--mute);margin:16px 0 8px;font-weight:800;letter-spacing:.4px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:0 0 4px}
input[type=text],input[type=number]{width:100%;font-family:inherit;font-size:16px;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;transition:border-color .2s ease}
input:focus{border-color:var(--ac);outline:none}
.row{display:flex;gap:10px;margin-bottom:12px}.row>div{flex:1}
.sku-wrap{position:relative}
.sku-wrap input{padding-right:48px}
.scan-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:var(--ac);color:var(--acx);border-radius:10px;display:grid;place-items:center;padding:0}
.scan-btn:active{transform:translateY(-50%) scale(.95)}
.scan-btn svg{width:18px;height:18px}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin:2px 0 14px;cursor:pointer;user-select:none}
.chk input{display:none}
.box{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;color:transparent;transition:background .2s ease,border-color .2s ease,color .2s ease}
.chk input:checked+.box{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.box svg{width:16px;height:16px;stroke-width:3}
.pri{width:100%;background:var(--ac);color:var(--acx);border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800}
.pri:focus{outline:none}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar button{flex:1;min-width:120px;background:none;border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:14px;font-weight:800;font-size:15px}
.bar .p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bar .p:focus{outline:none}
.fname-row{margin-bottom:10px}
.fname-row input{font-weight:600}
.cnt{color:var(--mute);font-size:13px;font-weight:700;margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);transition:opacity .2s ease}
.item:first-child{border-top:0}
.info{flex:1;min-width:0}.sku{font-weight:800;word-break:break-all}
.price{color:var(--mute);font-weight:600;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--acx);background:var(--ac);border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.mini{background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;transition:background .2s ease,border-color .2s ease,color .2s ease}
.mini.d{color:var(--bad)}.arm{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.empty{text-align:center;color:var(--mute);padding:20px 0;font-weight:600}
.pv{width:100%;overflow:hidden;margin-bottom:10px;border:1px solid var(--line);border-radius:10px}
/* POP: 1 unit = lebar kotak kecil */
.sheet{--u:8.1mm;--or:#e8a050;width:297mm;height:210mm;background:#fff;color:#000;display:grid;grid-template-columns:repeat(3,99mm);grid-template-rows:repeat(3,70mm);transform-origin:top left;font-family:Arial,Helvetica,sans-serif}
.cell{position:relative;padding:11mm 5mm 0}
.big{position:relative;width:calc(11*var(--u));height:46mm}
.bc{position:absolute;left:0;top:0;width:calc(8*var(--u));height:100%;display:grid;grid-template-columns:repeat(4,1fr);border:.6mm solid var(--or)}
.bc div{position:relative;display:flex;align-items:flex-end;justify-content:center;font-size:26mm;font-weight:700;-webkit-text-stroke:.55mm #000;line-height:.8;padding-bottom:4.5mm}
.bc div+div{border-left:.6mm solid var(--or)}
.bc .rp{-webkit-text-stroke:0;position:absolute;left:0;right:0;top:2mm;text-align:center;font-size:5.5mm;font-weight:700;line-height:1}
.sm{position:absolute;right:0;bottom:0;width:calc(3*var(--u));height:54%;display:grid;grid-template-columns:repeat(3,1fr);border:.6mm solid var(--or);border-left:0}
.sm div{display:flex;align-items:flex-end;justify-content:center;font-size:10.5mm;font-weight:700;-webkit-text-stroke:.3mm #000;line-height:.8;padding-bottom:4mm}
.sm div+div{border-left:.6mm solid var(--or)}
.old{position:absolute;left:calc(1.5*var(--u));width:calc(5*var(--u));top:0;height:11mm;text-align:center;font-size:6.5mm;font-weight:400;line-height:8mm}
.old:after{content:"";position:absolute;left:0;right:0;top:4.2mm;border-top:.4mm solid #e02020;transform:rotate(-6deg)}
.clip{position:absolute;right:0;top:0;width:10mm;height:auto;display:block}
.skus{display:flex;margin-top:1.8mm;width:max-content}
.skus b{width:var(--u);height:7.5mm;border:.6mm solid var(--or);border-left-width:0;text-align:center;font-size:5.5mm;line-height:6.5mm;font-weight:700}
.skus b:first-child{border-left-width:.6mm}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s ease;text-align:center;z-index:100}
#toast.on{opacity:1}
/* Scanner overlay */
#scanOverlay{display:none;position:fixed;inset:0;background:#000;z-index:200;flex-direction:column;align-items:center;justify-content:center}
#scanOverlay.on{display:flex}
#scanOverlay video{width:100%;max-width:480px;height:auto;border-radius:12px;background:#111}
#scanOverlay .scan-ui{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:12px;padding:16px}
#scanOverlay .scan-ui button{background:#fff;color:#000;border:0;border-radius:14px;padding:14px 24px;font-weight:800;font-size:15px}

/* pecah harga: ribuan di kotak besar (4), tiga digit akhir di kotak kecil (3) */
function split(p){
  p=Math.max(0,Math.round(Number(p)||0));
  let big='',small;
  if(p>=1000){big=String(Math.floor(p/1000));small=String(p%1000).padStart(3,'0')}else small=String(p);
  const pad=(s,n)=>Array.from({length:n},(_,i)=>s[i-(n-s.length)]||'');
  return {big:pad(big.slice(-4),4),small:pad(small,3)};
}
function cell(d){
  const s=d?split(d.harga):{big:['','','',''],small:['','','']};
  const chars=d?[...String(d.sku)].slice(0,7):[];while(chars.length<7)chars.push('');
  const old=d&&d.best&&d.lama?`<div class="old">${nf(d.lama)}</div>`:'';
  return `<div class="cell"><div class="big"><div class="bc">${s.big.map((c,i)=>`<div>${i===0?'<span class="rp">Rp.</span>':''}${c}</div>`).join('')}<img class="clip" src="${LOGO}" alt=""></div><div class="sm">${s.small.map(c=>`<div>${c}</div>`).join('')}</div>${old}</div><div class="skus">${chars.map(c=>`<b>${esc(c)}</b>`).join('')}</div></div>`;
}
function render(){
  $('#cnt').textContent=data.length+' POP · '+data.filter(d=>d.best).length+' best price';
  $('#list').innerHTML=data.length?data.map(d=>`<div class="item"><div class="info"><div class="sku">${esc(d.sku)}${d.best?'<span class="tag">BEST PRICE</span>':''}</div><div class="price">Rp ${nf(d.harga)}${d.best&&d.lama?' (lama '+nf(d.lama)+')':''}</div></div>
  <button class="mini" data-e="${d.id}" aria-label="Edit"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="mini d" data-d="${d.id}" aria-label="Hapus"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></div>`).join(''):'<div class="empty">Belum ada data</div>';
  const n=Math.max(1,Math.ceil(data.length/9));let h='';
  for(let p=0;p<n;p++){let c='';for(let i=0;i<9;i++)c+=cell(data[p*9+i]);h+=`<div class="pv"><div class="sheet">${c}</div></div>`}
  $('#pages').innerHTML=h;fit();
}
function fit(){document.querySelectorAll('.pv').forEach(pv=>{const s=pv.firstElementChild;s.style.transform='none';const sc=pv.clientWidth/s.offsetWidth;s.style.transform=`scale(${sc})`;pv.style.height=(s.offsetHeight*sc)+'px'})}
addEventListener('resize',fit);
let armed=null,armT;
function arm(btn,key){
  if(armed===key){clearTimeout(armT);armed=null;return true}
  armed=key;btn.classList.add('arm');toast('Tekan lagi untuk menghapus');
  clearTimeout(armT);armT=setTimeout(()=>{armed=null;btn.classList.remove('arm')},3000);return false;
}
function reset(){editId=null;$('#sku').value='';$('#harga').value='';$('#lama').value='';$('#best').checked=false;$('#lamaWrap').style.display='none';$('#mode').textContent='TAMBAH POP';$('#save').textContent='Simpan'}
$('#best').onchange=e=>{$('#lamaWrap').style.display=e.target.checked?'flex':'none'};
['#harga','#lama'].forEach(id=>$(id).addEventListener('input',e=>{const v=e.target.value.replace(/\D/g,'').slice(0,7);if(v!==e.target.value)e.target.value=v}));
$('#save').onclick=()=>{
  const sku=$('#sku').value.trim().slice(0,7),h=$('#harga').value,best=$('#best').checked,lama=$('#lama').value;
  if(!sku||h===''){toast('Isi SKU dan harga');return}
  if(Number(h)>9999999||Number(lama)>9999999){toast('Maksimal 9.999.999');return}
  if(best&&lama===''){toast('Isi harga lama');return}
  const rec={sku,harga:Number(h),best,lama:best?Number(lama):null};
  if(editId){const i=data.findIndex(d=>d.id===editId);data[i]={...data[i],...rec}}else data.push({id:Date.now()+Math.random(),...rec});
  store();reset();render();toast('Tersimpan');
};
$('#list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e){const d=data.find(x=>String(x.id)===b.dataset.e);editId=d.id;$('#sku').value=d.sku;$('#harga').value=d.harga;$('#best').checked=d.best;$('#lamaWrap').style.display=d.best?'flex':'none';$('#lama').value=d.lama||'';$('#mode').textContent='EDIT POP';$('#save').textContent='Perbarui';$('#sku').scrollIntoView({behavior:'smooth',block:'center'})}
  if(b.dataset.d&&arm(b,'d'+b.dataset.d)){data=data.filter(x=>String(x.id)!==b.dataset.d);store();reset();render();toast('Terhapus')}
};
$('#clear').onclick=e=>{if(data.length&&arm(e.currentTarget,'all')){data=[];store();reset();render();toast('Semua terhapus')}};

/* ===== Scanner barcode/QR ===== */
let scanStream=null,scanRaf=null,detector=null;
async function startScan(){
  if(!('BarcodeDetector' in window)){
    toast('Scanner tidak didukung di browser ini');
    return;
  }
  try{
    detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','qr_code','upc_a','upc_e']});
  }catch(e){toast('BarcodeDetector gagal');return}
  const ov=$('#scanOverlay');
  const video=$('#scanVideo');
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    video.srcObject=scanStream;
    await video.play();
    ov.classList.add('on');
    const loop=async()=>{
      if(!ov.classList.contains('on'))return;
      try{
        const codes=await detector.detect(video);
        if(codes&&codes.length){
          let val=String(codes[0].rawValue||'').replace(/\D/g,'').slice(0,7);
          if(val){
            stopScan();
            $('#sku').value=val;
            toast('SKU terdeteksi: '+val);
            return;
          }
        }
      }catch(e){}
      scanRaf=requestAnimationFrame(loop);
    };
    scanRaf=requestAnimationFrame(loop);
  }catch(e){
    toast('Izin kamera ditolak / tidak tersedia');
  }
}
function stopScan(){
  const ov=$('#scanOverlay');
  ov.classList.remove('on');
  if(scanRaf){cancelAnimationFrame(scanRaf);scanRaf=null}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  const video=$('#scanVideo');video.srcObject=null;
}
$('#scan').onclick=startScan;
$('#scanClose').onclick=stopScan;

/* ===== Ekspor Excel: 3x3 POP per lembar A4 landscape ===== */
async function exportXlsx(){
  if(!data.length){toast('Belum ada data');return}
  if(!window.ExcelJS){toast('Pustaka Excel belum termuat');return}
  const rawName=($('#fname').value||'POP-OFFERBIN').trim().replace(/[\\/:*?"<>|]+/g,'_').slice(0,80)||'POP-OFFERBIN';
  const fileName=rawName.endsWith('.xlsx')?rawName:rawName+'.xlsx';
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('POP',{pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:.3,right:.3,top:.3,bottom:.3,header:0,footer:0}}});
  for(let c=1;c<=35;c++)ws.getColumn(c).width=(c%12===0)?2:4.3;
  const pages=Math.max(1,Math.ceil(data.length/9));
  const OR={style:'medium',color:{argb:'FFE8A050'}};
  let imgId=null;try{imgId=wb.addImage({base64:LOGO,extension:'png'})}catch(e){}
  const F=(sz,b=false,n='Arial')=>({name:n,size:sz,bold:b});
  /* edges: string berisi t,b,l,r */
  const area=(r1,c1,r2,c2,val,font,al,edges,diag)=>{
    ws.mergeCells(r1,c1,r2,c2);
    for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){
      const b={};
      if(r===r1&&edges.includes('t'))b.top=OR;if(r===r2&&edges.includes('b'))b.bottom=OR;
      if(c===c1&&edges.includes('l'))b.left=OR;if(c===c2&&edges.includes('r'))b.right=OR;
      ws.getCell(r,c).border=b;
    }
    const m=ws.getCell(r1,c1);m.value=val;m.font=font;m.alignment=al;
    if(diag)m.border={...m.border,diagonal:{up:true,down:false,style:'thin',color:{argb:'FFE02020'}}};
  };
  const C={horizontal:'center',vertical:'bottom'};
  for(let p=0;p<pages;p++){
    for(let br=0;br<3;br++){const r0=p*36+br*12+1;for(let k=0;k<10;k++)ws.getRow(r0+k).height=14;ws.getRow(r0+10).height=26;ws.getRow(r0+11).height=10}
    for(let i=0;i<9;i++){
      const d=data[p*9+i],t=i%3,br=Math.floor(i/3),c0=1+t*12,r0=p*36+br*12+1;
      const s=d?split(d.harga):{big:['','','',''],small:['','','']};
      /* baris atas: Rp. | harga lama | kosong */
      area(r0,c0,r0+1,c0+1,'Rp.',F(14,true),{horizontal:'center',vertical:'top'},'tlr');
      const promo=d&&d.best&&d.lama;
      area(r0,c0+2,r0+1,c0+5,promo?Number(d.lama).toLocaleString('en-US'):null,F(16,false),{horizontal:'center',vertical:'center'},'t',promo);
      area(r0,c0+6,r0+1,c0+7,null,F(10),C,'tlr');
      /* kotak besar per angka – font tidak terlalu tebal */
      for(let k=0;k<4;k++)area(r0+2,c0+2*k,r0+9,c0+2*k+1,s.big[k]||null,F(52,false,'Arial Black'),C,'lrb');
      /* kotak kecil */
      for(let j=0;j<3;j++)area(r0+5,c0+8+j,r0+9,c0+8+j,s.small[j]||null,F(22,false,'Arial Black'),C,'tblr');
      /* SKU 7 kotak */
      const sk=d?[...String(d.sku)].slice(0,7):[];
      for(let k=0;k<7;k++)area(r0+10,c0+k,r0+10,c0+k,sk[k]||null,F(18,false),{horizontal:'center',vertical:'center'},'tblr');
      if(imgId!==null)ws.addImage(imgId,{tl:{col:c0+5.72,row:r0-1+0.06},ext:{width:42,height:32}});
    }
    if(p<pages-1)ws.getRow((p+1)*36).addPageBreak();
  }
  try{
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    // Coba unduh yang lebih andal di Android/Capacitor WebView
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=fileName;
    a.style.display='none';
    a.setAttribute('target','_blank');
    document.body.appendChild(a);
    // Trigger dengan user gesture (sudah dari onclick)
    a.click();
    // Fallback: jika download attribute diabaikan, buka di tab baru
    setTimeout(()=>{
      // Beberapa WebView butuh delay sedikit
      try{a.click()}catch(e){}
    },100);
    setTimeout(()=>{
      a.remove();
      URL.revokeObjectURL(url);
    },2500);
    toast('File Excel: '+fileName+' — cek folder Unduhan');
  }catch(e){
    console.error(e);
    toast('Gagal membuat file Excel');
  }
}
$('#xlsx').onclick=exportXlsx;
render();
</script>
</body>
</html>
